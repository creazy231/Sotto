# Runs Sotto's offline test suite (a fake WoW client in LuaJIT) on every push
# and pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install LuaJIT
        run: |
          sudo apt-get update -y
          sudo apt-get install -y luajit

      - name: Run the suite
        run: |
          luajit tests/run.lua
          luajit tests/syntax.lua
